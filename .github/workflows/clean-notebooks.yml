name: notebook-clean

on:
  push:
    branches: [master]
  pull_request:

jobs:
  notebook-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pre-commit
      - run: pre-commit run --all-files
      - run: git diff --exit-code   # red if stripping would change anything
